    <!DOCTYPE html>
    <html lang="pt-BR">

    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Um pedido ❤️</title>

        <link rel="stylesheet" href="CSS/main.css">

        <link
            href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Poppins:wght@300;400;600&display=swap"
            rel="stylesheet">

    </head>


    <body>


        <div class="pedido-container">


            <p class="frase">
                Depois de todos esses momentos...
            </p>


            <div class="heart-final">
                ❤️
            </div>


            <h1>
                Eu preciso te perguntar uma coisa...
            </h1>


            <h2>
                Você aceita ser minha namorada?
            </h2>


            <div class="botoes">


                <button id="sim">
                    ❤️ Sim
                </button>


                <button id="nao">
                    😭 Não
                </button>


            </div>


        </div>


        <audio id="musica" loop>
            <source src="mp3/sopramim.weba" type="audio/mpeg">
        </audio>

        <button id="playMusic">
            🎵
        </button>
        </div>
        <!-- Importa o framework Bootstrap 5 JavaScript -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
        <script src="js/scripts.js"></script>
        <script src="js/pedido.js"></script>


    </body>

    </html>
